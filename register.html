<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 320px;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-top: 0;
      font-size: 20px;
    }
    input {
      width: 100%;
      padding: 9px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button.submit-btn {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    button.submit-btn:hover {
      background-color: #218838;
    }
    .msg {
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 4px;
      text-align: center;
      display: none;
      font-size: 14px;
      font-weight: bold;
    }
    .msg.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
    .msg.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
    .link-text { text-align: center; margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Student Registration</h2>
    <div id="msgBox" class="msg"></div>

    <form id="signupForm">
      <input type="text" id="regName" placeholder="Full Name" required>
      <input type="email" id="regEmail" placeholder="Email Address" required>
      <input type="password" id="regPass" placeholder="Password" required>
      <input type="password" id="regConfirmPass" placeholder="Confirm Password" required>
      <button type="submit" class="submit-btn">Register</button>
    </form>

    <div class="link-text">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script>
    function showMsg(message, isSuccess) {
      const msgBox = document.getElementById('msgBox');
      msgBox.textContent = message;
      msgBox.className = 'msg ' + (isSuccess ? 'success' : 'error');
    }

    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPass').value;
      const confirmPass = document.getElementById('regConfirmPass').value;

      // 1. Password Match Check
      if (pass !== confirmPass) {
        showMsg("Passwords do not match!", false);
        return;
      }

      // 2. Retrieve existing users from Local Storage
      let users = JSON.parse(localStorage.getItem('users')) || [];

      // 3. Duplicate Email Check
      if (users.some(user => user.email === email)) {
        showMsg("Email already registered!", false);
        return;
      }

      // 4. Save user to Local Storage
      users.push({ name: name, email: email, password: pass });
      localStorage.setItem('users', JSON.stringify(users));

      showMsg("Registration successful! Redirecting to login...", true);
      this.reset();

      // Redirect to login page after 2 seconds
      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);
    });
  </script>

</body>
</html>
